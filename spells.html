<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spells - D&D Companion</title>
  <style>
    body { font-family: Arial, sans-serif; background: #FBF6EE; color: #241A14; margin: 0; padding: 24px; }
    h1 { font-family: Georgia, serif; font-weight: normal; }
    #search { width: 100%; max-width: 420px; padding: 10px; font-size: 16px; border: 1px solid #CBB89A; border-radius: 6px; }
    #count { color: #6A5A4A; margin: 10px 0; }
    .spell { background: #fff; border: 1px solid #E8DDCB; border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; max-width: 700px; white-space: pre-wrap; }
    #empty { color: #8B2635; display: none; }
  </style>
</head>
<body>
  <h1>Spells</h1>
  <input id="search" type="text" placeholder="Search spells by name...">
  <p id="count"></p>
  <p id="empty"></p>
  <div id="results"></div>

  <script>
    // ---------- Spell (matches the Spell class in the UML) ----------
    class Spell {
      #spellID;        // int
      #rulesetID;      // int
      #name;           // String
      #level;          // int
      #school;         // String
      #castingTime;    // String
      #spellRange;     // String
      #components;     // String
      #duration;       // String
      #description;    // String
      #higherLevel;    // String
      #concentration;  // boolean
      #classes;        // String

      constructor(data) {
        this.#spellID = data.spellID;
        this.#rulesetID = data.rulesetID;
        this.#name = data.name;
        this.#level = data.level;
        this.#school = data.school;
        this.#castingTime = data.castingTime;
        this.#spellRange = data.spellRange;
        this.#components = data.components;
        this.#duration = data.duration;
        this.#description = data.description;
        this.#higherLevel = data.higherLevel;
        this.#concentration = data.concentration === 1;  // JSON stores 0 or 1
        this.#classes = data.classes;
      }

      // Used by SpellSearch to match the keyword against the spell name
      matchesKeyword(keyword) {
        return this.#name.toLowerCase().includes(keyword.toLowerCase());
      }

      // + getDetails(): String
      getDetails() {
        const level = this.#level === 0 ? 'Cantrip' : 'Level ' + this.#level;
        return this.#name + '\n' +
          level + ' ' + this.#school + ' | ' + this.#castingTime + ' | ' + this.#spellRange +
          ' | ' + this.#components + ' | ' + this.#duration +
          (this.#concentration ? ' | Concentration' : '') + ' | ' + this.#classes + '\n' +
          this.#description;
      }
    }

    // ---------- SpellStore (storage: spells.json) ----------
    class SpellStore {
      #filePath;  // String

      constructor(filePath) {
        this.#filePath = filePath;
      }

      // + loadSpells(): List<Spell>
      async loadSpells() {
        const response = await fetch(this.#filePath);
        const data = await response.json();
        return data.map(item => new Spell(item));
      }
    }

    // ---------- SpellSearch (logic) ----------
    class SpellSearch {
      #spells = [];     // List<Spell>, multiplicity 0..*
      #store;           // SpellStore, multiplicity 1

      constructor(store) {
        this.#store = store;
      }

      // + searchByKeyword(keyword: String): List<Spell>
      async searchByKeyword(keyword) {
        if (this.#spells.length === 0) {
          this.#spells = await this.#store.loadSpells();  // loads on the first search
        }
        return this.#spells.filter(spell => spell.matchesKeyword(keyword));
      }
    }

    // ---------- SpellSearchScreen (this page) ----------
    class SpellSearchScreen {
      #keyword = '';   // String
      #search;         // SpellSearch

      constructor(search) {
        this.#search = search;
        document.getElementById('search').addEventListener('input', event => {
          this.onSearch(event.target.value.trim());
        });
      }

      // + onSearch(keyword: String): void
      async onSearch(keyword) {
        this.#keyword = keyword;
        try {
          const matches = await this.#search.searchByKeyword(keyword);
          if (matches.length > 0) {
            this.showResults(matches);
          } else {
            this.showEmptyState('No spells found. Try a different name.');
          }
        } catch (error) {
          this.showEmptyState('Could not load spells.json');
        }
      }

      // + showResults(spells: List<Spell>): void
      showResults(spells) {
        document.getElementById('empty').style.display = 'none';
        document.getElementById('count').textContent = spells.length + ' spell(s)';
        const results = document.getElementById('results');
        results.innerHTML = '';
        spells.slice(0, 50).forEach(spell => {
          const card = document.createElement('div');
          card.className = 'spell';
          card.textContent = spell.getDetails();
          results.appendChild(card);
        });
      }

      // + showEmptyState(message: String): void
      showEmptyState(message) {
        document.getElementById('results').innerHTML = '';
        document.getElementById('count').textContent = '0 spell(s)';
        const empty = document.getElementById('empty');
        empty.textContent = message;
        empty.style.display = 'block';
      }
    }

    // ---------- Start the page ----------
    const store = new SpellStore('spells.json');
    const search = new SpellSearch(store);
    const screen = new SpellSearchScreen(search);
    screen.onSearch('');   // show the first spells when the page opens
  </script>
</body>
</html>
